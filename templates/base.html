{% load static %}
<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}Путевые заметки{% endblock %}</title>
    <link
        rel="stylesheet"
        href="{% static 'homepage/css/bootstrap.min.css' %}"
    >
    <link rel="stylesheet" href="{% static 'homepage/css/style.css' %}">
</head>
<body>
    <header class="container site-header">
        <img
            src="{% static 'homepage/img/logo.png' %}"
            alt="Путевые заметки"
            class="travel-logo"
        >
        <span class="site-title">Путевые заметки</span>
    </header>

    {% include "includes/navigation.html" %}

    <main class="container">
        {% block content %}
        {% endblock %}
    </main>

    <footer class="container mt-4 mb-3">
        <p>© <span id="current-year"></span> Путевые заметки</p>
    </footer>

    <script src="{% static 'homepage/js/main.js' %}"></script>
</body>
</html>
